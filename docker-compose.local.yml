services:
  dashboard:
    build:
      context: .
      args:
        API_URL: ${API_URL}
        SCRAPER_API_URL: ${SCRAPER_API_URL}
        API_KEY: ${API_KEY}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
    container_name: mobilehaat-dashboard-dev
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -q -O- http://127.0.0.1:3000/api/health | grep -q 'status.*ok'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
